        <div class="login-form-area" *ngIf="showDive">
          <div class="login-form-body">
           
            <form
              name="form"
              (ngSubmit)="f.form.valid && forgot()"
              #f="ngForm"
              novalidate
            >
              <div class="fr-top-con">
                <a href="/#/"><img class="logo-login mb-4" style="margin-left: 35%;width: 110px;"
                  src="assets/images/logo3.png"></a>
                  
                <h1 class="lg-heading wow animated-1 fadeInUp mb-3">
                  Forgot Password
                </h1>
                <!--<h1 class="lg-heading wow animated-1 fadeInUp" (click)="hideDive()">Forgot Password</h1>-->
                <div
                  class="alert alert-success"
                  role="alert"
                  *ngIf="isForgotSuccess"
                >
                  <strong>Congrats !</strong> Email Successfully sent. Please
                  check your email.
                </div>
                <div
                  class="alert alert-danger"
                  role="alert"
                  *ngIf="isForgotError"
                >
                  <strong>Failure !</strong> Email does not exist.
                </div>

                <div
                  [ngClass]="{ 'has-error': f.submitted && !email.valid }"
                  class="form-group"
                >
                  <label for="email" class="dmslb">Email Id</label>
                  <input
                    type="text"
                    class="form-control dmsbx"
                    name="email"
                    autocomplete="off"
                    [(ngModel)]="model.email"
                    #email="ngModel"
                    required
                  />
                </div>
