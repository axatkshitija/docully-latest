<div class="overview-cont">
  <div class="ovr-head">
    <h3>Data Rooms</h3>
  </div>
  <div class="ovr-body">
    <p class="ovr-title">
      <!--  {{all_datarooms.length }}  -->active (2 remaining)
    </p>
    <div class="dataroom-list">
      <div class="dataroom-items" *ngFor="let dataroom of all_datarooms">
        <div class="dr-image">
          <img src="../assets/images/folder-icon.png" class="img-fluid" />
        </div>
        <div class="dr-title-up">
          <h4 class="drt-name">
            <a
              (click)="
                gotoURl(
                  dataroom.id,
                  dataroom.dataroom_name,
                  dataroom.choose_overview_default_page
                )
              "
            >
              {{ dataroom.dataroom_nameFront !== "" ? dataroom_nameFront : "" }}
            </a>
          </h4>
          <p class="dr-othr-info">
            <span class="dr-size">Size: 35.9 MB</span>
            <span class="dr-date"
              >Last updated
              {{
                dataroom.updated_date | date: "dd-MM-yyyy HH:mm":"timezone"
              }}</span
            >
          </p>
        </div>
      </div>
    </div>
  </div>
  <div class="over-member t-mr">
    <div class="ovr-head">
      <h3>Members</h3>
    </div>
    <div class="ovr-body">
      <p class="ovr-title"></p>
      <div class="dataroom-list">
        <div class="dataroom-items" *ngFor="let member of all_members">
          <div class="dr-image">
            <img src="../assets/images/user-pic.jpg" class="img-fluid" />
          </div>
          <div class="dr-title-up">
            <h4 class="drt-name">{{ member.first_name }}</h4>
            <p class="dr-othr-info"></p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
