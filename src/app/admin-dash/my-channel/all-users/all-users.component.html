<div class="ovr-head">
</div>
<div class="ovr-body">
  <div class="col-3">
    <div class="ovr-head">
      <h3>All Users List</h3>
    </div>
    <div>
      <span *ngIf="all_users != undefined">Total: {{all_users.length}}</span>
    </div>
  </div>
  <div class="seach-inner-bx mt-4 mb-4 row">
    <div class="col-6">
      <input type="text" class="form-control srch-tx-bx" placeholder="Search by User Full Name"
        [(ngModel)]="search.userFullName" />
    </div>
    <div class="col-6">
      <input type="text" class="form-control srch-tx-bx" placeholder="Search by Email Id"
        [(ngModel)]="search.emailId" />
    </div>
  </div>
  <div class="seach-inner-bx mt-4 mb-4 row">
    <div class="col-6">
      <input type="text" class="form-control srch-tx-bx" placeholder="Search by Team" [(ngModel)]="search.team" />
    </div>
    <div class="col-6">
      <input type="text" class="form-control srch-tx-bx" placeholder="Search by Dataroom"
        [(ngModel)]="search.dataroom" />
    </div>
  </div>
  <div class="seach-inner-bx mt-4 mb-4 row">
    <div class="col-6">
      <input type="text" class="form-control srch-tx-bx" placeholder="Search by Channel" [(ngModel)]="search.channel" />
    </div>
    <div class="col-6">
      <select class="form-control form-control-sm w-100" [(ngModel)]="search.role">
        <option value="" disabled selected>Search by Role</option>
        <option value="admin">Admin</option>
        <option value="laadmin">LA Admin</option>
        <option value="enduser">End User</option>
      </select>
    </div>
    <div class="col-3 mb-4">
      <button class="btn btn-primary addmem-Btn" (click)="getFilteredUsers()">
        Search
      </button>
    </div>
    <div class="col-3 mb-4">
      <button class="btn btn-primary addmem-Btn" (click)="resetList()">
        Reset
      </button>
    </div>
  </div>

  <div>
    <table class="table dl-table tbl-sub" cellpadding="0" cellspacing="0" border="0">
      <thead>
        <tr>
          <th>Sr. No.</th>
          <th>User Full Name</th>
          <th>Email Id</th>
          <th>Channel</th>
          <th>Team</th>
          <th>Dataroom</th>
          <th>Role</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngIf="all_users && all_users.length == 0">
          <td></td>
          <td></td>
          <td></td>
          <td>Data not available</td>
          <td></td>
          <td></td>
          <td></td>
        </tr>
        <tr *ngFor="let user of all_users; let i = index;">
          <td>{{ i+1 }}</td>
          <td>{{ user.userfullname }}</td>
          <td>{{ user.email }} </td>
          <td>{{ user.chanel }}</td>
          <td>{{ user.team }}</td>
          <td>{{ user.dataroomname }}</td>
          <td>{{ user.role }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
