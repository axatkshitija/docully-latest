<div class="ovr-head">
</div>
<div class="ovr-body">
  <div class="col-3">
    <div class="ovr-head">
      <h3>Dataroom Users List</h3>
    </div>
    <div>
      <span *ngIf="dataroom_users != undefined">Total: {{dataroom_users.length}}</span>
    </div>
  </div>
  <div class="seach-inner-bx mt-4 mb-4 row">
    <div class="col-6">
      <input type="text" class="form-control srch-tx-bx" placeholder="Search by User Full Name"
        (input)="searchList($event)" />
    </div>
  </div>

  <div>
    <table class="table dl-table tbl-sub" cellpadding="0" cellspacing="0" border="0">
      <thead>
        <tr>
          <th>Sr. No.</th>
          <th>User Full Name</th>
          <th>Email Id</th>
          <th>Team</th>
          <th>Dataroom</th>
          <th>Role</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngIf="dataroom_users && dataroom_users.length == 0">
          <td></td>
          <td></td>
          <td></td>
          <td>Data not available</td>
          <td></td>
          <td></td>
          <td></td>
        </tr>
        <tr *ngFor="let user of dataroom_users; let i = index;">
          <td>{{ i+1 }}</td>
          <td>{{ user.userfullname }}</td>
          <td>{{ user.email }} </td>
          <td>{{ user.team }}</td>
          <td>{{ user.dataroomname }}</td>
          <td>{{ user.role }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
