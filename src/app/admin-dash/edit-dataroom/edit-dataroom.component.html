<!-- edit data room single -->
<div
  class="modal fade"
  id="editDataRoomdir{{ i }}"
  tabindex="-1"
  role="dialog"
  aria-labelledby="exampleModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog modal-md cr-n-dataroom" role="document">
    <div class="modal-content" *ngIf="dataroom">
      <form>
        <div class="modal-header cdr-modal cdr-h-c align-items-center">
          <h5 class="modal-title" id="exampleModalLabel">
            Edit {{ dataroom.dataroom_nameFront }} Data Room
          </h5>
          <button
            type="button"
            class="close"
            data-dismiss="modal"
            aria-label="Close"
          >
            <i class="material-icons">&#xE5CD;</i>
          </button>
        </div>
        <div class="modal-body cr-n-dr">
          <div class="dr-tab-content">
            <div class="form-group">
              <div class="row m-0 align-items-center">
                <label for="inputDataroom" class="col-sm-4 col-form-label"
                  >Data Room ID</label
                >
                <div class="col-sm-8 col-form-label">
                  <!-- <strong style="font-weight:600">Google</strong> -->
                  <input
                    type="text"
                    class="form-control"
                    placeholder=""
                    [(ngModel)]="dataroom.dataroom_id"
                    name="dataroom_id"
                  />
                </div>
              </div>

              <div class="row m-0 align-items-center">
                <label for="inputDataroom" class="col-sm-4 col-form-label"
                  >Data Room Name</label
                >
                <div class="col-sm-8 col-form-label">
                  <!-- <strong style="font-weight:600">Google</strong> -->
                  <input
                    type="text"
                    class="form-control"
                    placeholder="Google"
                    [(ngModel)]="dataroom.dataroom_nameFront"
                    name="dataroom_name"
                    required
                    minlength="3"
                    maxlength="50"
                    #dataroom_name="ngModel"
                  />

                  <div
                    *ngIf="
                      dataroom_name.errors &&
                      (dataroom_name.dirty || dataroom_name.touched)
                    "
                    class="alert alert-danger"
                  >
                    <div [hidden]="!dataroom_name.errors['required']">
                      Dataroom Name is required!
                    </div>
                    <div [hidden]="!dataroom_name.errors['minlength']">
                      Dataroom must be at least 3 characters long.
                    </div>
                    <div [hidden]="!dataroom_name.errors['maxlength']">
                      Data Room cannot be more than 100 characters long.
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div class="form-group">
              <div class="row m-0 align-items-center">
                <label class="col-sm-4 col-form-label">Enable module</label>
                <div class="col-sm-8">
                  <!-- <div class="enabl-module">
                    <mat-slide-toggle [(ngModel)]="dataroom.dataroom_modules.is_watermarking" name="is_watermarking">Watermarking</mat-slide-toggle>

                    <mat-slide-toggle [(ngModel)]="dataroom.dataroom_modules.is_drm" name="is_drm">Shortcut</mat-slide-toggle>
                    
                    <mat-slide-toggle [(ngModel)]="dataroom.dataroom_modules.is_question_and_answers" name="is_question_and_answers">Q&A</mat-slide-toggle>
                    
                    <mat-slide-toggle [(ngModel)]="dataroom.dataroom_modules.is_collabration" name="is_collabration">Collaboration</mat-slide-toggle>
                    
                    <mat-slide-toggle [(ngModel)]="dataroom.dataroom_modules.is_ocr" name="is_ocr">OCR</mat-slide-toggle>
                    
                    <mat-slide-toggle [(ngModel)]="dataroom.dataroom_modules.is_editor" name="is_editor">Editor
                    </mat-slide-toggle>
                </div>-->
                </div>
              </div>
            </div>

            <div class="form-group">
              <div class="row m-0 align-items-center">
                <label class="col-sm-4 col-form-label"
                  >Apply Account level Branding</label
                >
                <div class="col-sm-8 text-left">
                  <mat-slide-toggle
                    [(ngModel)]="dataroom.account_level_branding"
                    name="account_level_branding"
                  ></mat-slide-toggle>
                </div>
              </div>
            </div>
            <div class="form-group">
              <div class="row m-0 align-items-center">
                <label class="col-sm-4 col-form-label"
                  >Storage Allowed (GB)</label
                >
                <div class="col-sm-8">
                  <input
                    type="number"
                    min="0"
                    class="form-control"
                    [(ngModel)]="dataroom.dataroom_storage_allocated"
                    name="dataroom_storage_allocated"
                  />
                </div>
              </div>
            </div>

            <div class="modal-footer cdr-md-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-dismiss="modal"
              >
                Cancel
              </button>
              <button
                type="button"
                class="btn btn-primary"
                type="button"
                [disabled]="dataroom_name.errors"
                (click)="updateDataroominformation(dataroom)"
                data-dismiss="modal"
              >
                Save
              </button>
            </div>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
