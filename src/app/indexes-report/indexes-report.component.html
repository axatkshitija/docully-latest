<app-header></app-header>
<section id="cdr-body">
	<div class="container-fluid">
		<div fxLayout="row" fxLayoutAlign="space-between start" fxLayoutGap="15px" fxLayout.xs="column" fxLayout.sm="column" fxLayoutAlign.xs="center stretch" fxLayoutAlign.sm="center stretch">
	      <app-data-room-left fxFlex="15" fxFlex.xs="100" fxFlexOrder.xs="1">
	      </app-data-room-left>
	      <div fxFlex="64" fxFlex.xs="100" fxFlexOrder.xs="2">

	      		<mat-toolbar class="add-tbpd">
	            <div class="title">
	              <h2>Index Report</h2>
	            </div>
	            <span fxFlex></span>
	          </mat-toolbar>
	          <div class="cdr-breadcrumb">
              <ol class="breadcrumb">

                <li class="breadcrumb-item active">Index Report</li>
              </ol>
              <span fxFlex></span>
            </div>
            <div class="slt-pre p20px height583Top">
                <div class="date-select">

                <mat-datepicker-toggle matSuffix [for]="Topicker"></mat-datepicker-toggle>
                <mat-datepicker #Topicker></mat-datepicker>
              </div>
              <div class="tab-content document-table" id="pills-tabContent">
                  <div class="tab-pane fade show active" id="listViewDr" role="tabpanel" aria-labelledby="pills-home-tab">
              <button mat-raised-button color="primary" class="btn btn-default" (click)="getStatusId()">Download</button>
            </div>
                </div>

            </div>
            
            </mat-card>
             </div>
            <div fxFlex="23" fxFlex.xs="100" fxFlexOrder.xs="3">
		        <!--rt aside component start-->
		        <app-document-right-side-menu>
		        </app-document-right-side-menu>
		        <!--rt aside component end-->
		      </div>
	      	
	     
  		</div>
	</div>
