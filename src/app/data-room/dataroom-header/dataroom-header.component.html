<!--header component start-->
<mat-toolbar class="topbar" style="height: auto !important">
  <div class="cdr_branding" [routerLink]="['/dashboard']">
    <img src="assets/images/logo2.png" />
  </div>
  <div class="cdr-topToolbar">
    <div class="user-name">
      <button data-toggle="modal" data-target="#userProfileCdr">
        <span id="uName" *ngIf="user">Welcome, {{ user.first_name }}</span>
        <i class="fa fa-align-left"></i>
      </button>
    </div>
  </div>
</mat-toolbar>
<!--header component End-->

<!-- Modal -->
<div
  class="modal md-lf-rt right fade"
  id="userProfileCdr"
  tabindex="-1"
  role="dialog"
  aria-labelledby="exampleModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header" *ngIf="user">
        <div class="media profile-pic-dt" *ngIf="avatarUrl!=null">
          <img class="d-flex mr-3 rounded-circle" [src]="avatarUrl" onerror="this.src='https://services.docullyvdr.com/assets/images/Profile.png'"/>
        </div>
        <div class="media-body">
          <h5 class="mt-0">{{ user.first_name }} {{ user.last_name }}</h5>
          {{ user.email }}
        </div>
        <button
          type="button"
          class="close"
          data-dismiss="modal"
          aria-label="Close"
        >
          <i class="material-icons">&#xE5CD;</i>
        </button>
      </div>
      <!-- <div class="upgrade-account">
                <span>{{upgrade_msg}}</span>
            </div> -->
      <div class="modal-body p-0">
        <ul class="page-setting-nav">
          <li>
            <a href="/user-personal-info"
              ><i class="fa fa-cog"></i> Profile</a
            >
          </li>
          <li>
            <a (click)="goToLink('https://docullyvdr.zohodesk.com/')"
              ><i class="fa fa-commenting-o"></i> Support</a
            >
          </li>
          <li (click)="resetDisclaimerStatus(user.id);">
            <a><i class="fa fa-sign-out"></i> Sign Out</a>
          </li>
        </ul>
        <!-- <div class="used-space-img text-center">
                    <img src="assets/images/total-size-used.jpg"></div> -->
      </div>
    </div>
  </div>
</div>
