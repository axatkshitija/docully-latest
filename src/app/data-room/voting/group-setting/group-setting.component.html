<app-header></app-header>
<section id="cdr-body">
  <div class="container-fluid">
    <div fxLayout="row" fxLayoutAlign="space-between start" fxLayoutGap="15px" fxLayout.xs="column" fxLayout.sm="column"
      fxLayoutAlign.xs="center stretch" fxLayoutAlign.sm="center stretch">
      <app-data-room-left fxFlex="15" fxFlex.xs="100" fxFlexOrder.xs="1"></app-data-room-left>
      <div fxFlex="85" fxFlex.xs="100" fxFlexOrder.xs="2">
        <mat-card class="mat-card p0">
          <mat-toolbar class="add-tbpd">
            <div class="filter-opt">Group Setting</div>
            <span fxFlex></span>

            <div class="cdr-buttons">
              <button mat-raised-button class="cdr-btn big-btn blue-btn mr-2" routerLink="/voting"
                style="margin-right: 10px;">
                Back
              </button>
              <button mat-raised-button class="cdr-btn big-btn orange-btn" data-toggle="modal"
                data-target="#creategroup" data-backdrop="static" data-keyboard="false">
                Create Voters Group
              </button>
            </div>
          </mat-toolbar>
          <table class="table dl-table" cellpadding="0" cellspacing="0" border="0">
            <thead>
              <tr>
                <th>Sr. No.</th>
                <th>Group Name</th>
                <th>Description</th>
                <th>Acion</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngIf="voter_group_list.length == 0">
                <td colspan="4">No groups created</td>
              </tr>
              <tr *ngFor="
                  let vote_group_details of voter_group_list;
                  let i = index
                ">
                <td>{{ i + 1 }}</td>
                <td>{{ vote_group_details.title }}</td>
                <td>
                  {{ vote_group_details.description }}
                </td>
                <td>
                  <button class="tb-actb" mat-button [matMenuTriggerFor]="menu">
                    <i class="material-icons">&#xE5D4;</i>
                  </button>
                  <mat-menu #menu="matMenu" class="cdr-actbtn animated flipInX">
                    <button mat-menu-item data-toggle="modal" data-toggle="modal"
                      [attr.data-target]="'#editgroupsetting' + i" data-backdrop="static" data-keyboard="false">
                      Edit
                    </button>
                    <button mat-menu-item (click)="deleteVoterGroup(vote_group_details)">
                      Delete
                    </button>

                    <button mat-menu-item [routerLink]="[
                        '../manager-group-members',
                        vote_group_details.id
                      ]">
                      Manage Voter
                    </button>
                  </mat-menu>
                </td>
                <!-- Edit Group-->
                <div class="modal fade" id="editgroupsetting{{ i }}" tabindex="-1" role="dialog"
                  aria-labelledby="exampleModalLabel" aria-hidden="true">
                  <div class="modal-dialog" role="document">
                    <div class="modal-content">
                      <div class="modal-header cdr-modal cdr-h-c">
                        <h5 class="modal-title">Edit Group</h5>
                        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                          <i class="material-icons">&#xE5CD;</i>
                        </button>
                      </div>
                      <div class="modal-body cr-n-dr">
                        <form action="">
                          <div class="form-group mt-2">
                            <label>Group Name</label>
                            <input type="text" name="group_name" class="form-control" placeholder="Enter Group Name"
                              [(ngModel)]="vote_group_details.title" />
                          </div>
                          <div class="form-group mt-2">
                            <label>Group Description</label>
                            <textarea class="form-control" name="group_description" id="" cols="30" rows="5"
                              placeholder="Please Edit Description from Here"
                              [(ngModel)]="vote_group_details.description"></textarea>
                          </div>
                        </form>
                      </div>
                      <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-dismiss="modal">
                          Cancel
                        </button>
                        <button type="button" class="btn btn-primary" (click)="editGroup(vote_group_details)"
                          data-dismiss="modal">
                          Save
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              </tr>
            </tbody>
          </table>
        </mat-card>
      </div>

      <!--End Disclaimer Status-->
    </div>
  </div>
</section>

<!-- Create Group-->

<div class="modal fade" id="creategroup" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel"
  aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header cdr-modal cdr-h-c">
        <h5 class="modal-title">Create Group</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <i class="material-icons">&#xE5CD;</i>
        </button>
      </div>
      <div class="modal-body cr-n-dr">
        <form action="">
          <div class="form-group mt-2">
            <label>Group Name</label>
            <input type="text" name="group_name" class="form-control" placeholder="Group Name" name="title"
              [(ngModel)]="group_data.title" />
          </div>
          <div class="form-group mt-2">
            <label>Group Description</label>
            <textarea class="form-control" name="group_description" id="" cols="30" rows="5"
              placeholder="Please enter group description" [(ngModel)]="group_data.description"></textarea>
          </div>
          <div class="form-group mt-2">
            <label style="width: 100%">Add Voters</label>

            <div class="form-group mt-2">
              
              <mat-chip-listbox #chipList>
                <mat-chip *ngFor="let member of members; let indx = index" [selectable]="selectable"
                  [removable]="removable" (removed)="remove(member, indx)">
                  {{ member }}
                  <mat-icon matChipRemove *ngIf="removable">cancel</mat-icon>
                </mat-chip>
                <input placeholder="Type a name or email id to select voters" #memberGroupInput [formControl]="fruitCtrl" [matAutocomplete]="auto"
                  [matChipInputFor]="chipList" [matChipInputSeparatorKeyCodes]="separatorKeysCodes"
                  [matChipInputAddOnBlur]="addOnBlur" (matChipInputTokenEnd)="add($event)" name="member"
                  (focus)="focusFunction()"
                  style="border-bottom: 1px solid" />
              </mat-chip-listbox>

              <mat-autocomplete #auto="matAutocomplete" (optionSelected)="selected($event)">
                <mat-option *ngFor="let member of filteredMembers | async" [value]="member">
                  {{ member }}
                </mat-option>
              </mat-autocomplete>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-dismiss="modal">
          Cancel
        </button>
        <button type="button" class="btn btn-primary" (click)="createGroup()">
          Save
        </button>
      </div>
    </div>
  </div>
</div>

<app-footer></app-footer>
