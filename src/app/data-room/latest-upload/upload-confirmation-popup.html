
<div style='padding: 10px;'>
  <div mat-dialog-title>Notify<i class="fa fa-times" aria-hidden="true" (click)="onNoClick()"
    style="float: right !important;cursor: pointer;"></i></div>
  
  <div mat-dialog-content>
  <div class="alert alert-danger">
    Are you sure you want to notify all permissioned members about new uploaded document/s?
  </div>
  </div>
  <div mat-dialog-actions>
  <button mat-button [mat-dialog-close]="data.yes" class="btn btn-primary">Yes</button>
  <button mat-button [mat-dialog-close]="data.no" class="btn btn-primary">No</button>
  </div>
</div>
