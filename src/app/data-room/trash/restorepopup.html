<div style="padding: 30px 20px;">
  <div mat-dialog-title>
    Notify!
    <i class="fa fa-times" aria-hidden="true" (click)="onNoClick()"
      style="float: right !important; cursor: pointer"></i>
  </div>

  <div mat-dialog-content>
    <div class="a-info">Your request for restore folders/files can't be completed. Some of your folders/files parent
      folder are deleted.</div>
  </div>
  <br>
  <div mat-dialog-actions>
    <button mat-button class="btn btn-primary" (click)="onNoClick()">
      Close
    </button>
  </div>
</div>
