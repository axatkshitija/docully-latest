<app-header></app-header>
<section id="cdr-body">
  <div class="container-fluid">
    <div fxLayout="row" fxLayoutAlign="space-between start" fxLayoutGap="15px" fxLayout.xs="column" fxLayout.sm="column"
      fxLayoutAlign.xs="center stretch" fxLayoutAlign.sm="center stretch">
      <app-data-room-left fxFlex="15" fxFlex.xs="100" fxFlexOrder.xs="1" (onInitEvent)="receiveAutoMsgHandler($event)"></app-data-room-left>


      <div fxFlex="64" fxFlex.xs="100" fxFlexOrder.xs="2">
        <mat-card class="mat-card p0">
          <mat-toolbar>Reports</mat-toolbar>
          <div class="page-hdname">
            <div class="title-pg-act">
              <i class="material-icons cnr-icon">&#xE2C0;</i>
              <span class="t-text">Download Reports</span>
            </div>
            <button class="icon-btn" (click)="downloadStatus()">
              <i class="material-icons">&#xE879;</i>
              <span class="t-text">Export</span>
            </button>
          </div>


          <div class="datatime-status">
            <div class="topbar-af">
              <div class="slt-pre">
                <div class="date-select">
                  <input matInput [matDatepicker]="Frompicker" [max]="maxDate" [min]="minDate" placeholder="From Date"
                    [(ngModel)]="from_date" name="from_date"
                    (dateChange)="changeDateWise($event.value, to_date)">
                  <mat-datepicker-toggle matSuffix [for]="Frompicker"></mat-datepicker-toggle>
                  <mat-datepicker #Frompicker></mat-datepicker>
                </div>

                <div class="date-select">
                  <input matInput [matDatepicker]="Topicker" [max]="maxDate" [min]="minDate" placeholder="From Date"
                    [(ngModel)]="to_date" name="to_date"
                    (dateChange)="changeDateWise(from_date, $event.value)">
                  <mat-datepicker-toggle matSuffix [for]="Topicker"></mat-datepicker-toggle>
                  <mat-datepicker #Topicker></mat-datepicker>
                </div>
              </div>
              <input type="text" placeholder="Search Downloaded by" class="form-control filterSr searchbox full-src"
                [(ngModel)]="filterQuery" required>
            </div>
          </div>

          <mat-progress-spinner class="progress-align-center" [mode]="'indeterminate'" *ngIf="show_spinner">
          </mat-progress-spinner>
          <div *ngIf="!show_spinner" class="table-content minHeight511">
            <pagination-controls (pageChange)="p = $event"></pagination-controls>
            <table class="table dl-table filesh-tbl">
              <tr>
                <th>Download by</th>
                <th>Date</th>
                <th>file name</th>
              </tr>
              <tr *ngFor="let item of data | dnameSearch : filterQuery | paginate: { itemsPerPage: 10, currentPage: p}">
                <td>{{ item.user__first_name }} {{ item.user__last_name }}</td>
                <td>{{ item.created_date | date: 'dd-MM-yyyy, HH:mm a' : usertimezone['time_zone__offset']  }}
                  {{'(' +usertimezone['time_zone__abbreviation'] +')'}}
                </td>
                <td>{{ item.title }}</td>
              </tr>
            </table>

            <span *ngIf="dataSize && dataSize == 0">Report data not available.</span>

          </div>

        </mat-card>
      </div>
      <div fxFlex="23" fxFlex.xs="100" fxFlexOrder.xs="3">
        <app-report-tab></app-report-tab>
      </div>
    </div>
  </div>
</section>
<app-footer></app-footer>
