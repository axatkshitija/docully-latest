<div mat-dialog-title>
  Notify!
  <i class="fa fa-times" aria-hidden="true" (click)="onNoClick()" style="float: right !important; cursor: pointer"></i>
</div>

<div mat-dialog-content>
  <div class="a-info">Your request seems to be taking a longer time than required. It may be because of the large volume of data in your request. For the purpose of your optimum experience, we suggest you resubmit your request now or try again later.</div>
</div>
<br>
<div mat-dialog-actions>
  <button mat-button class="btn btn-primary" (click)="onYesClick()">
    Retry 
  </button>
  <button mat-button class="btn btn-primary" (click)="onNoClick()">
    Close
  </button>
 
</div>
