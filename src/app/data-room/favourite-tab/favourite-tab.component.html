<app-header></app-header>
<section id="cdr-body">
  <div class="container-fluid">
    <div fxLayout="row" fxLayoutAlign="space-between start" fxLayoutGap="15px" fxLayout.xs="column" fxLayout.sm="column"
      fxLayoutAlign.xs="center stretch" fxLayoutAlign.sm="center stretch">
      <app-data-room-left fxFlex="15" fxFlex.xs="100" fxFlexOrder.xs="1">
      </app-data-room-left>
      <div fxFlex="64" fxFlex.xs="100" fxFlexOrder.xs="2">
        <mat-card class="mat-card p0">
          <mat-toolbar class="add-tbpd">
            <div class="title">
              <h2>
                Favourites
              </h2>
            </div>
            <span fxFlex></span>
          </mat-toolbar>
          <div>
            <div class="cdr-breadcrumb">
              <ol class="breadcrumb">
                <li class="breadcrumb-item">
                  <a routerLink="/documents">All Documents</a>
                </li>
                <li class="breadcrumb-item active">
                  Favourites
                </li>
              </ol>
              <span fxFlex></span>
            </div>
            <div class="datatime-status">
              <div class="topbar-af">

                <div *ngIf="BulkDelete">
                  <button type="button" (click)="download_popup()" class="ico-bnt">
                    <i class="fa fa-download" style="color: #3a62eb !important;"></i> Download
                  </button>
                  <button type="button" (click)="downloadShortcutBulk()" class="ico-bnt">
                    <i class="fa fa-external-link" style="color: #3a62eb !important;"></i> Doculink
                  </button>
                  <button type="button" (click)="remove_favourite_all_files()" class="ico-bnt">
                    <i class="fa fa-star"></i> Remove Favourites
                  </button>
                </div>
                <span fxFlex></span>

              </div>
            </div>

            <div class="tab-content document-table" id="pills-tabContent">

              <div class="tab-pane fade show active" id="listViewDr" role="tabpanel" aria-labelledby="pills-home-tab">
                <table class="table table-striped">
                  <thead class="user-per-head">
                    <tr>
                      <th>
                        <input type="checkbox" id="select" name="select" (change)="selectAll($event.target.checked)" />
                      </th>
                      <th>Index</th>
                      <th>Documents</th>

                      <th>Action</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr *ngIf="show_spinner === true">
                      <td colspan="6">
                        <mat-progress-spinner class="progress-align-center" style="margin: 0 auto !important"
                          [mode]="'indeterminate'" *ngIf="show_spinner">
                        </mat-progress-spinner>
                      </td>
                    </tr>
                    <tr *ngIf="show_spinner === false && all_root_folder_list.length ==0">
                      <td colspan="6">
                        No documents in Favourites.
                      </td>
                    </tr>
                    <tr *ngFor="
                        let folder of all_root_folder_list
                          | paginate
                            : {
                                itemsPerPage: 10,
                                currentPage: p,
                                totalItems: size
                              };
                        let i = index
                      ">
                      <td>
                        <input type="checkbox" [(ngModel)]="folder.checked" (change)="showBulkDownload()" />
                      </td>

                      <td>{{ folder.index }}</td>
                      <td>
                        <div class="tbl-icon-txt">
                          <span class="icon-span"><img [src]="folder.icons" /></span>
                          <span *ngIf="!folder.folder__is_folder" class="recent-doc-title"><a href="{{ baseUrl }}/file-view/{{ folder.folder_id }}/{{
                                user.id
                              }}" style="color: blue" target="_blank">{{ folder.folder__name }}</a></span>
                          <span *ngIf="folder.folder__is_folder" class="recent-doc-title"><a
                              (click)="goToNextFolder(folder.folder_id)" style="color: blue" target="_blank">{{
                              folder.folder__name }}</a></span>


                        </div>
                      </td>
                      <td>

                        <button class="tb-actb" mat-button [matMenuTriggerFor]="menu">
                          <i class="material-icons">&#xE5D4;</i>
                        </button>
                        <mat-menu #menu="matMenu" class="cdr-actbtn animated flipInX">
                          <a mat-menu-item *ngIf="!folder.folder__is_folder" href="{{ baseUrl }}/file-view/{{ folder.folder_id }}/{{
                            user.id
                          }}" style="color: blue !important" target="_blank">
                            View
                          </a>
                          <button mat-menu-item *ngIf="folder.folder__is_folder"
                            (click)="goToNextFolder(folder.folder_id)" style="color: blue !important">
                            View
                          </button>
                          <button mat-menu-item (click)="remove_favourite_single_files(folder.folder_id)">
                            Remove Favourite
                          </button>
                          <button mat-menu-item
                            *ngIf="!folder.folder__is_folder && folder.perm.is_view_and_print_and_download"
                            (click)="DownloadFiles(folder)">
                            Download
                          </button>
                          <button mat-menu-item
                            *ngIf="folder.folder__is_folder && folder.perm.is_view_and_print_and_download"
                            (click)="downloadsinglefolder(folder)">
                            Download
                          </button>
                          <button mat-menu-item *ngIf="folder.folder__is_folder"  (click)="BulkDownloadDrm(folder)">
                            Download as Doculink
                          </button>
                          <button mat-menu-item  *ngIf="!folder.folder__is_folder"  (click)="downloadShortcut(folder.folder_id)">
                            Download as Doculink
                          </button>
                        </mat-menu>
                      </td>
                    </tr>
                  </tbody>
                </table>
                <div class="pagination-sec" *ngIf="show_spinner==false">
                  <pagination-controls (pageChange)="getAllFavourites($event)"></pagination-controls>
                </div>
                <div style="clear: both"></div>
              </div>
            </div>
          </div>
        </mat-card>
      </div>
      <div fxFlex="23" fxFlex.xs="100" fxFlexOrder.xs="3">
        <!--rt aside component start-->
        <app-document-right-side-menu> </app-document-right-side-menu>
        <!--rt aside component end-->
      </div>
    </div>
  </div>
</section>
<app-footer></app-footer>
