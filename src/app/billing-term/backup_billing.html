                  <td>Cost - {{ plan.cost }}</td>
                  <tr>

                  </td>
                  <td> -->
                    <!-- {{ plans.edition }}
                  </td>
                </tr> -->
              </tbody>
            </table>
          </div>

          <h5 class="text-center">Select Billing Term</h5>
          <div class="row text-center">

                <p class="pt-2">Billed Annually</p>

            </div>
            <div class="col-md-4">
              <div class="bill-term1">
                <button

            <div class="col-md-4 centerAlign">

<div
  class="modal md-lf-rt right fade"
  id="userProfileCdr"
  tabindex="-1"
  role="dialog"
  aria-labelledby="exampleModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header" *ngIf="user">
        <div class="media profile-pic-dt">
          <img class="d-flex mr-3 rounded-circle" [src]="avatarUrl" />
        </div>
        <div class="media-body">
          <h5 class="mt-0">{{ user.first_name }} {{ user.last_name }}</h5>
          {{ user.email }}
        </div>
        <button
          type="button"
          class="close"
          data-dismiss="modal"
          aria-label="Close"
        >
          <i class="material-icons">&#xE5CD;</i>
        </button>
      </div>
      <!-- <div class="upgrade-account">
        <span>{{upgrade_msg}}</span>
    </div> -->
      <div class="modal-body p-0">
        <ul class="page-setting-nav">
          <li (click)="signout(user.id)">
            <a href=""><i class="fa fa-sign-out"></i> Sign Out</a>
          </li>
        </ul>
        <!-- <div class="used-space-img text-center">
            <img src="assets/images/total-size-used.jpg"></div> -->
      </div>
    </div>
  </div>
</div>
