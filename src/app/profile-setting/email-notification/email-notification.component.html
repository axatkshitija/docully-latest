<app-header [user]="user"></app-header>
<style type="text/css">
  .modal-backdrop {
    display: none;
  }
</style>
<section id="cdr-body" *ngIf="user">
  <div class="container-fluid">
    <div class="row">
      <div class="col-md-10 offset-md-1">
        <div class="row">
          <div class="col-sm-3">
            <div class="panel panel-card">
              <div class="cdr-pib">
                <img
                  [src]="avatarUrl"
                  class="img-fluid d-flex mr-3 rounded-circle"
                  onerror="this.src='https://services.docullyvdr.com/assets/images/Profile.png'"
                  style="
                    height: 100px;
                    width: 100px;
                    /* align-items: center; */
                    display: table;
                    margin-left: auto;
                    margin-right: auto !important;
                  "
                />
              </div>
              <div class="cdr-list-group rounded-0 border-0">
                <a
                  class="cdr-list-group-item"
                  [routerLink]="['../user-personal-info']"
                >
                  <span class="pull-right badge"
                    ><i class="fa fa-user" aria-hidden="true"></i
                  ></span>
                  Profile
                </a>
                <a
                  class="cdr-list-group-item"
                  [routerLink]="['../changepassword']"
                >
                  <span class="pull-right badge"
                    ><i class="fa fa-key" aria-hidden="true"></i
                  ></span>
                  Change Password
                </a>
                <a
                  class="cdr-list-group-item"
                  [routerLink]="['../email-notification-info']"
                >
                  <span class="pull-right badge"
                    ><i class="fa fa-key" aria-hidden="true"></i
                  ></span>
                  Email Notification
                </a>
              </div>
            </div>
          </div>
          <div class="col-md-9">
            <form #heroForm="ngForm">
              <div class="card profile-right">
                <div class="card-header" style="display: flex">
                  <h4 class="card-title">Email Notification</h4>
                  <!-- <div > -->
                  <span fxFlex></span>
                  <a
                    mat-raised-button
                    class="cdr-btn big-btn blue-btn"
                    href="javascript:void(0)"
                    (click)="goBack()"
                    >Back</a
                  >
                  <!-- <button type="button" class="btn btn-primary" (click)="goBack()"> Back</button> -->
                  <!-- </div> -->
                </div>

                <div class="card-block">
                  <div class="general-info">
                    <div class="row">
                      <div class="col-lg-12">
                        <div class="table-responsive">
                          <table class="table m-0">
                            <tbody>
                              <tr>
                                <th width="200" scope="row">
                                  Receive Daily Emails
                                </th>
                                <td>
                                  <input
                                    type="checkbox"
                                    id="select"
                                    class="cdr-checkbt"
                                    name="receive_email"
                                    [(ngModel)]="update.receive_email"
                                    (change)="
                                      onChangeSelect($event.target.checked)
                                    "
                                  />
                                </td>
                              </tr>
                              <tr>
                                <th scope="row">Receive Notification Emails</th>
                                <td>
                                  <input
                                    type="checkbox"
                                    id="select"
                                    class="cdr-checkbt"
                                    name="receive_notification"
                                    [(ngModel)]="update.receive_notification"
                                    (change)="
                                      onChangeSelect1($event.target.checked)
                                    "
                                  />
                                </td>
                              </tr>
                              <th></th>
                              <td>
                                <div class="submit-btn-st">
                                  <button
                                    class="btn btn-default"
                                    aria-disabled="true"
                                    (click)="editUserProfile(update)"
                                  >
                                    Update
                                  </button>
                                </div>
                              </td>
                            </tbody>
                          </table>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
<app-footer [user]="user"></app-footer>
