                <div style="display: flex; align-items: center; justify-content: center;">
                    <div class="login-form-area">
                        <div class="login-form-body">
                            <form name="form" (ngSubmit)="f.form.valid && login()" #f="ngForm" novalidate>
                                <div class="fr-top-con">
                                    <a href="/#/"><img style="margin-left: 35%;width: 110px;" class="logo-login mb-4"
                                            src="assets/images/logo3.png"></a>

                                    <h1 class="lg-heading wow animated-1 fadeInUp mb-3" data-wow-delay="1s">Sign In</h1>

                                    <div class="alert alert-danger" role="alert" *ngIf="isLoginError">
                                        <strong>Oops !</strong> Email Id/Password is incorrect!!!
                                        <!-- <strong>System Maintenance is going on.</strong>  Please try again later!!! -->
                                    </div>

                                    <div [ngClass]="{ 'has-error': f.submitted && !email.valid }" class="form-group">
                                        <label for="email" class="error-msg dmslb">Email Id</label>
                                        <input type="text" class="form-control dmsbx" name="email"
                                            [(ngModel)]="model.email" #email="ngModel" autocomplete="off" required />
                                        <small *ngIf="email.hasError('required') && email.touched"
                                            class="text-danger">Email
                                            is required .
                                        </small>
                                    </div>

                                    <div [ngClass]="{ 'has-error': f.submitted && !password.valid }" class="form-group">
                                        <label for="password" class="error-msg dmslb"> Password </label>
                                        <input type="password" class="form-control dmsbx" name="password"
                                            [(ngModel)]="model.password" #password="ngModel" required />
                                        <span *ngIf="!passwordToggleIcon"
                                            style="cursor: pointer; float: right; margin-top: -32px; margin-right: 10px;"
                                            (click)="togglePassword()"><i class="fa fa-eye"
                                                aria-hidden="true"></i></span>
                                        <span *ngIf="passwordToggleIcon"
                                            style="cursor: pointer; float: right; margin-top: -32px; margin-right: 10px;"
                                            (click)="togglePassword()"><i class="fa fa-eye-slash"
                                                aria-hidden="true"></i></span>
                                        <small *ngIf="password.hasError('required') && password.touched"
                                            class="text-danger">Password is required .
                                        </small>
                                    </div>

                                    <!-- <div>
                                        <label for="captcha" class="error-msg dmslb"> Captcha </label>

                                        </div>

                                        <div class="row">

                                                </label>

                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-12 text-center submit-btn-st">

                        </div>
